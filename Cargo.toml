[package]
name = "agnam"
version = "0.9.0"
edition = "2024"

[dependencies]
adw = { package = "libadwaita", version = "0.7", features = ["v1_5"] }
gtk = { version = "0.9", package = "gtk4", features = ["v4_10"] }
glib = "0.20"
async-channel = "2"
zip = { version = "2", default-features = false, features = ["bzip2", "deflate-flate2", "deflate64", "flate2", "lzma", "xz", "zstd"] }
natord = "1.0"
unicode-normalization = "0.1"
thiserror = "2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
turbojpeg = { version = "1.5.1", default-features = false, features = ["pkg-config", "require-simd"] }
tempfile = "3"
sevenz-rust = { version = "0.6", default-features = false }
unrar = "=0.5.8"
unrar_sys = "=0.5.8"
tar = { version = "0.4", default-features = false }
delharc = "0.8"
memmap2 = "0.9"

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["bmp"] }
sevenz-rust = { version = "0.6", default-features = false, features = ["compress"] }
